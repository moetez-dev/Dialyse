# Dev broker: anonymous access on 1883, plus a websocket listener for browsers.
listener 1883
allow_anonymous true

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

# File d'attente du broker.
# Un abonné hors ligne (session persistante) voit ses messages QoS 1
#empilés : la file doit être assez large pour couvrir une coupure, et
#sauvegardée souvent pour survivre à un redémarrage du broker.
max_queued_messages 10000
max_inflight_messages 100
autosave_interval 60
