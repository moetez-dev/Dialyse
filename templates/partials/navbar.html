{% load icons %}
<header class="sticky top-0 z-40 h-navbar border-b border-line bg-surface">
  <div class="flex h-full items-center gap-3 px-4">

    <button type="button" data-sidebar-toggle
            class="grid h-9 w-9 shrink-0 place-items-center rounded-lg text-body-soft hover:bg-surface-sunken hover:text-body lg:hidden"
            aria-label="Ouvrir la navigation" aria-controls="sidebar">
      {% icon "menu" cls="h-5 w-5" %}
    </button>

    <a href="{% url 'landing' %}" class="flex items-center gap-2.5">
      <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-brand-700 text-white">
        {% icon "activity" cls="h-[18px] w-[18px]" %}
      </span>
      <span class="font-serif text-[17px] font-semibold tracking-tight text-body">Dialyse&nbsp;Manager</span>
    </a>

    <div class="ml-auto flex items-center gap-2">

      <button type="button" data-theme-toggle
              class="grid h-9 w-9 place-items-center rounded-lg text-body-soft hover:bg-surface-sunken hover:text-body"
              aria-label="Changer de thème">
        <span class="hidden dark:block">{% icon "sun" cls="h-[18px] w-[18px]" %}</span>
        <span class="block dark:hidden">{% icon "moon" cls="h-[18px] w-[18px]" %}</span>
      </button>

      {% if current_user %}
        <a href="{% url 'accounts:profile' %}"
           class="flex items-center gap-2.5 rounded-lg px-2 py-1.5 hover:bg-surface-sunken">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-surface-sunken text-body-soft">
            {% icon "user" cls="h-4 w-4" %}
          </span>
          <span class="hidden text-left leading-tight sm:block">
            <span class="block text-sm font-medium text-body">{{ current_user.username }}</span>
            <span class="block text-xs text-body-faint">{{ current_user.role_label }}</span>
          </span>
        </a>

        <a href="{% url 'accounts:logout' %}"
           class="flex items-center gap-2 rounded-lg border border-line px-3 py-2 text-sm text-body-soft
                  hover:bg-surface-sunken hover:text-body
                  {% if current_user.first_login %}disabled-link{% endif %}">
          {% icon "log-out" cls="h-4 w-4" %}
          <span class="hidden sm:inline">Déconnexion</span>
        </a>
      {% endif %}
    </div>
  </div>
</header>
