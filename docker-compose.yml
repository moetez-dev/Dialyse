# Dialyse — local development stack.
#   docker compose up -d            Next.js web + Django API + pipeline
#   docker compose up -d api        Django API and legacy pages only
#   docker compose logs -f listener follow MQTT ingestion

services:
  web:
    image: node:24-alpine
    container_name: dialyse-web
    working_dir: /workspace/app/web
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    environment:
      DJANGO_API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./app/web:/workspace/app/web
      - web-node-modules:/workspace/app/web/node_modules
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    image: dialyse-backend
    container_name: dialyse-api
    working_dir: /workspace/app/api/django
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      # Applique les migrations au démarrage. Mettre RUN_MIGRATIONS=0 pour
      # démarrer sans toucher au schéma (base de développement figée).
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-1}"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api,web,0.0.0.0"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      MQTT_BROKER: mqtt
      AI_SERVICE_URL: http://ai:8001/analyze/
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    image: dialyse-backend
    container_name: dialyse-ai
    working_dir: /workspace/app/api/ai
    command: python -m uvicorn qwen_api:app --host 0.0.0.0 --port 8001
    environment:
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - .:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  css:
    image: node:24-alpine
    container_name: dialyse-legacy-css
    working_dir: /workspace
    command: sh -c "npm install --no-audit --no-fund && npm run css:watch"
    volumes:
      - .:/workspace
      - legacy-css-node-modules:/workspace/node_modules
    stdin_open: true
    tty: true

  mqtt:
    image: eclipse-mosquitto:2
    container_name: dialyse-mqtt
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  listener:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    image: dialyse-backend
    container_name: dialyse-listener
    working_dir: /workspace/app/api/mqtt
    command: python mqtt_listener.py
    environment:
      WAIT_FOR_DB: "1"
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
      AI_SERVICE_URL: http://ai:8001/analyze/
      N8N_CRITICAL_RISK_WEBHOOK_URL: http://host.docker.internal:5678/webhook/dialysis-critical-risk
    env_file:
      - .env
    volumes:
      - .:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      mqtt:
        condition: service_started

volumes:
  mosquitto-data:
  web-node-modules:
  legacy-css-node-modules:
